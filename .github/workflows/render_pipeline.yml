name: Render & Upload Video Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp Pillow requests google-api-python-client

    - name: Run Video Generation Pipeline
      run: |
        python3 main.py

    - name: Upload Artifact (Rendered Video)
      uses: actions/upload-artifact@v4
      with:
        name: final-output-video
        path: output_video.mp4
        retention-days: 7
